[package]
name = "dume"
version = "0.1.0"
description = "Dum-E — a local-first RAG chatbot that teaches video producers their gear and editing software"
authors = ["Chris Palanca"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dume_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sqlite-vec = "0.1.9"
reqwest = { version = "0.13.4", features = ["json", "query", "stream"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "process", "io-util"] }
anyhow = "1.0.104"
thiserror = "2.0.20"
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3.34"
tauri-plugin-log = "2.9.1"
tauri-plugin-dialog = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
